<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PK Football</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#0b1220;color:#eef3ff}
header{padding:22px 16px;background:#111b30;position:sticky;top:0;z-index:2}
h1{margin:0;font-size:28px}.sub{opacity:.7;margin-top:4px;font-size:13px}
nav{display:flex;gap:8px;overflow:auto;padding:12px 16px;background:#0e1728;position:sticky;top:87px;z-index:2}
button{border:0;border-radius:999px;padding:9px 13px;background:#1b2942;color:#dce7ff;font-weight:600}
button.active{background:#25c49a;color:#06150f}
main{max-width:900px;margin:auto;padding:16px}.grid{display:grid;gap:12px}
.card{background:#121e33;border:1px solid #22314b;border-radius:16px;padding:15px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.teams{flex:1}.team{display:flex;align-items:center;gap:8px;margin:7px 0;font-weight:650}.team img{width:24px;height:24px;object-fit:contain}.time{text-align:right;min-width:78px}.muted{opacity:.65;font-size:12px}.badge{display:inline-block;padding:4px 8px;border-radius:8px;background:#1c2c48;font-size:11px;margin-bottom:8px}.live{color:#ff6b6b;font-weight:800}.score{font-size:18px;font-weight:800}.section{margin:24px 0 10px;font-size:20px}.empty{padding:30px;text-align:center;opacity:.7}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 5px;border-bottom:1px solid #22314b;text-align:left}
</style></head>
<body>
<header><h1>⚽ PK Football</h1><div class="sub" id="updated">Loading real football data…</div></header>
<nav id="leagues"></nav>
<main><div id="content"></div></main>
<script>
let data=null, selected='all';
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDate(s){return new Date(s).toLocaleString(undefined,{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function fixtureCard(f){
 const st=f.status||{}, live=['1H','2H','HT','ET','P','LIVE'].includes(st.short);
 const hs=f.goals?.home, as=f.goals?.away;
 const played=hs!=null&&as!=null;
 return `<article class="card"><div class="badge">${esc(f.league.name)}</div>
 <div class="row"><div class="teams">
 <div class="team"><img src="${esc(f.home.logo)}" onerror="this.style.display='none'">${esc(f.home.name)}</div>
 <div class="team"><img src="${esc(f.away.logo)}" onerror="this.style.display='none'">${esc(f.away.name)}</div>
 </div><div class="time ${live?'live':''}">${live?'● LIVE':played?`<span class="score">${hs} - ${as}</span>`:fmtDate(f.date)}<div class="muted">${esc(st.long||'')}</div></div></div></article>`;
}
function render(){
 const fs=(data.fixtures||[]).filter(f=>selected==='all'||String(f.league.id)===selected);
 $('content').innerHTML=fs.length?`<div class="section">${selected==='all'?'Matches':'Matches'}</div><div class="grid">${fs.map(fixtureCard).join('')}</div>`:`<div class="empty">No matches found.</div>`;
}
function renderLeagues(){
 const leagues=[...new Map((data.fixtures||[]).map(f=>[f.league.id,f.league])).values()];
 $('leagues').innerHTML='<button class="active" data-id="all">All</button>'+leagues.map(l=>`<button data-id="${l.id}">${esc(l.name)}</button>`).join('');
 document.querySelectorAll('#leagues button').forEach(b=>b.onclick=()=>{
   selected=b.dataset.id;
   document.querySelectorAll('#leagues button').forEach(x=>x.classList.remove('active'));
   b.classList.add('active');
   render();
 });
}
fetch('./data.json?'+Date.now()).then(r=>r.json()).then(x=>{data=x;$('updated').textContent='Real data • Updated '+new Date(x.updatedAt).toLocaleString();renderLeagues();render()}).catch(e=>{$('content').innerHTML='<div class="empty">Data not available yet. Run the GitHub Action once.</div>'});
</script></body></html>
