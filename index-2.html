<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PK Football</title><style>
*{box-sizing:border-box}body{margin:0;background:#07110c;color:#fff;font-family:Arial}header{padding:20px;background:#0c1b13;position:sticky;top:0;z-index:5}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:25px;font-weight:bold}.sub,.small{color:#9eb3a5;font-size:13px}nav{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:10px 14px;background:#173522;color:#fff}.active{background:#2dbd69}.lang{margin-left:auto}.lang button{padding:7px 10px}.lang .selected{background:#2dbd69}main{max-width:900px;margin:auto;padding:18px}.search{width:100%;padding:14px;border-radius:14px;background:#0d1d14;color:#fff;border:1px solid #244431}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#0d1d14;border:1px solid #1d3827;border-radius:18px;padding:17px}.league{color:#65d993;font-size:13px}.teams{display:flex;justify-content:space-between;margin:14px 0;font-weight:bold;gap:8px}.bar{height:8px;background:#203728;border-radius:10px;overflow:hidden}.fill{height:100%;background:#2dbd69}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.stat{background:#12271a;padding:10px;border-radius:12px}.pct{font-size:20px;font-weight:bold}.confidence{display:inline-block;margin-top:10px;padding:7px;background:#183b26;border-radius:10px}.hidden{display:none}footer{text-align:center;color:#728679;padding:30px}
</style></head><body>
<header><div class="top"><div><div class="logo">⚽ PK Football</div><div class="sub" id="subtitle">Live scores • Analysis • Predictions</div></div><div class="lang"><button id="enBtn" class="selected" onclick="setLang('en')">EN</button><button id="frBtn" onclick="setLang('fr')">FR</button></div></div><nav><button id="tabM" class="active" onclick="show('m',this)">Matches</button><button id="tabP" onclick="show('p',this)">Predictions</button><button id="tabL" onclick="show('l',this)">Leagues</button></nav></header>
<main><section id="m"><input id="q" class="search" placeholder="🔎 Search for a team or league..." oninput="render()"><h2 id="upcoming">🔥 Upcoming matches</h2><div id="mg" class="grid"></div></section>
<section id="p" class="hidden"><h2 id="predTitle">🎯 PK Predictions</h2><p class="small" id="demo">Demo data for now.</p><div id="pg" class="grid"></div></section>
<section id="l" class="hidden"><h2 id="leagueTitle">🏆 Leagues</h2><div class="grid"><div class="card">🇬🇧 Premier League</div><div class="card">🇪🇸 La Liga</div><div class="card">🇮🇹 Serie A</div><div class="card">🇩🇪 Bundesliga</div><div class="card">🇫🇷 Ligue 1</div><div class="card">🌍 Champions League</div></div></section></main><footer>PK Football</footer>
<script>
let lang='en';
const a=[['Arsenal','Leeds','Premier League','20:00',58,24,18,72,'2 - 1',61,57],['Chelsea','Bournemouth','Premier League','17:30',55,25,20,68,'2 - 1',64,60],['Manchester United','Tottenham','Premier League','19:30',46,27,27,61,'2 - 1',66,63]];
const t={en:{subtitle:'Live scores • Analysis • Predictions',matches:'Matches',predictions:'Predictions',leagues:'Leagues',search:'🔎 Search for a team or league...',upcoming:'🔥 Upcoming matches',predTitle:'🎯 PK Predictions',demo:'Demo data for now.',confidence:'Confidence',score:'Score',over:'Over 2.5',btts:'BTTS',x2:'1X2'},fr:{subtitle:'Scores en direct • Analyse • Prédictions',matches:'Matchs',predictions:'Prédictions',leagues:'Ligues',search:'🔎 Rechercher une équipe ou une ligue...',upcoming:'🔥 Matchs à venir',predTitle:'🎯 Prédictions PK',demo:'Données de démonstration pour le moment.',confidence:'Confiance',score:'Score',over:'Plus de 2,5',btts:'Les deux équipes marquent',x2:'1X2'}};
function render(){let q=document.getElementById('q').value.toLowerCase();let x=a.filter(v=>(v[0]+' '+v[1]+' '+v[2]).toLowerCase().includes(q));document.getElementById('mg').innerHTML=x.map(v=>`<div class="card"><div class="league">${v[2]}</div><div class="teams"><span>${v[0]}</span><span class="small">${v[3]}</span><span>${v[1]}</span></div><div class="bar"><div class="fill" style="width:${v[4]}%"></div></div><p class="small">${t[lang].x2}: ${v[4]}% • ${v[5]}% • ${v[6]}%</p><span class="confidence">${t[lang].confidence}: ${v[7]}%</span></div>`).join('');document.getElementById('pg').innerHTML=a.map(v=>`<div class="card"><div class="league">${v[2]}</div><h3>${v[0]} vs ${v[1]}</h3><div class="stats"><div class="stat">${t[lang].score}<br><b>${v[8]}</b></div><div class="stat">${t[lang].confidence}<br><b>${v[7]}%</b></div><div class="stat">${t[lang].over}<br><b>${v[9]}%</b></div><div class="stat">${t[lang].btts}<br><b>${v[10]}%</b></div></div></div>`).join('')}
function setLang(l){lang=l;document.documentElement.lang=l;let z=t[l];document.getElementById('subtitle').textContent=z.subtitle;document.getElementById('tabM').textContent=z.matches;document.getElementById('tabP').textContent=z.predictions;document.getElementById('tabL').textContent=z.leagues;document.getElementById('q').placeholder=z.search;document.getElementById('upcoming').textContent=z.upcoming;document.getElementById('predTitle').textContent=z.predTitle;document.getElementById('demo').textContent=z.demo;document.getElementById('enBtn').classList.toggle('selected',l==='en');document.getElementById('frBtn').classList.toggle('selected',l==='fr');render()}
function show(id,b){['m','p','l'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
render();
</script></body></html>
